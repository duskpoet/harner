<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harner</title>
<link rel="stylesheet" href="/app.css">
<script src="/marked.umd.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<header>
  <button id="menu" type="button" aria-label="Chats">☰</button>
  <h1 id="title">harner</h1>
  <span id="conn" class="dot" title="connection"></span>
  <button id="notify" type="button" hidden>Enable notifications</button>
</header>
<main>
  <nav id="list" aria-label="Chats"></nav>
  <section id="chat">
    <div id="empty" class="muted">Pick a chat on the left.</div>
    <div id="pending"></div>
    <article id="transcript"></article>
    <form id="promptForm" hidden>
      <textarea id="prompt" rows="3" placeholder="Message (Ctrl+Enter sends)"></textarea>
      <div class="row">
        <span id="status" class="muted"></span>
        <button type="button" id="cancel">Cancel run</button>
        <button type="submit" id="send">Send</button>
      </div>
    </form>
  </section>
</main>
</body>
</html>
